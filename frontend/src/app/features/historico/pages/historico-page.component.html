<section class="page-shell">
  <header class="hero">
    <h1>Histórico</h1>
    <button type="button" class="ghost" (click)="load()" [disabled]="loading()">Atualizar</button>
  </header>

  @if (error()) { <p class="error">{{ error() }}</p> }
  @if (loading()) { <p class="loading">Carregando...</p> }
  @else {
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Tipo</th>
            <th>Descrição</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody>
          @for (h of historico(); track h.id) {
            <tr [class]="h.tipo">
              <td>{{ h.id }}</td>
              <td><span class="badge">{{ h.tipo }}</span></td>
              <td>{{ h.descricao }}</td>
              <td>{{ h.data }}</td>
            </tr>
          } @empty {
            <tr><td colspan="4" class="empty">Nenhum registro no histórico.</td></tr>
          }
        </tbody>
      </table>
    </div>
  }
</section>
